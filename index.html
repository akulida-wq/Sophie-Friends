<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sophie &amp; Friends</title>
    <style>
      @font-face {
        font-family: 'Nunito';
        src: url('/fonts/nunito-600.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('/fonts/nunito-700.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('/fonts/nunito-800.woff2') format('woff2');
        font-weight: 800;
        font-display: swap;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #cfe8f5;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      }
      #app { width: 100%; height: 100%; }
      canvas { display: block; }

      /* --- Choice panel: max 3 large touch cards, no timer --- */
      .choice-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 1.5vh;
        padding: 3vw;
        align-items: center;
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 0.45s ease, transform 0.45s ease;
        pointer-events: none;
      }
      .choice-panel__prompt {
        padding: 1.4vh 2.6vh;
        border-radius: 18px;
        background: rgba(255, 250, 240, 0.92);
        box-shadow: 0 4px 16px rgba(90, 80, 60, 0.14);
        font-size: 2.6vh;
        font-weight: 600;
        color: #6b5d4f;
        text-align: center;
        max-width: 88vw;
      }
      .choice-panel__cards {
        display: flex;
        gap: 3vw;
        justify-content: center;
        align-items: stretch;
        width: 100%;
      }
      .choice-panel--open {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .choice-card {
        flex: 1;
        max-width: 32%;
        min-height: 25vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5vh;
        border: 3px solid #f2e3d1;
        border-radius: 28px;
        background: rgba(255, 252, 246, 0.97);
        box-shadow: 0 8px 24px rgba(90, 80, 60, 0.16);
        cursor: pointer;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .choice-card:hover {
        transform: scale(1.05);
        border-color: #eeceac;
        box-shadow: 0 10px 28px rgba(90, 80, 60, 0.22);
      }
      .choice-card:active {
        transform: scale(0.97);
      }
      .choice-card__icon {
        font-size: 9vh;
        line-height: 1;
      }
      .choice-card__label {
        font-size: 2.6vh;
        color: #6b5d4f;
        font-weight: 700;
      }

      /* --- Плавающие плашки: маркер над Бруно и имена (без миганий) --- */
      .float-chip {
        position: fixed;
        transform: translate(-50%, -100%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        z-index: 16;
      }
      .float-chip--on { opacity: 1; }
      .float-chip--marker {
        width: 7.5vh;
        height: 7.5vh;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.94);
        box-shadow: 0 5px 18px rgba(90, 80, 60, 0.2);
        font-size: 3.8vh;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: chip-bob 2.6s ease-in-out infinite;
      }
      .float-chip--name {
        padding: 0.8vh 2vh;
        border-radius: 14px;
        background: rgba(255, 250, 240, 0.92);
        box-shadow: 0 4px 12px rgba(90, 80, 60, 0.16);
        font-size: 2.2vh;
        font-weight: 700;
        color: #6b5d4f;
      }
      @keyframes chip-bob {
        0%, 100% { transform: translate(-50%, -100%) translateY(0) scale(1); }
        50% { transform: translate(-50%, -100%) translateY(-8px) scale(1.08); }
      }

      /* --- Аватарка Софи (общая для плашек и пузырей) --- */
      .sophie-avatar {
        flex: none;
        width: 5.4vh;
        height: 5.4vh;
        border-radius: 50%;
        background: #fdf3e3;
        border: 2px solid #f0dfc8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3vh;
      }

      /* --- Стартовая плашка-наведение --- */
      .intro-banner {
        position: fixed;
        left: 50%;
        bottom: 5vh;
        transform: translateX(-50%) translateY(16px);
        display: flex;
        align-items: center;
        gap: 1.6vh;
        padding: 1.8vh 2.6vh;
        border-radius: 22px;
        background: rgba(255, 250, 240, 0.96);
        box-shadow: 0 8px 26px rgba(90, 80, 60, 0.2);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease, transform 0.5s ease;
        z-index: 19;
        max-width: 86vw;
      }
      .intro-banner--on {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        pointer-events: auto;
      }
      .intro-banner__text {
        font-size: 2.6vh;
        font-weight: 600;
        color: #6b5d4f;
      }

      /* --- Tap cue: gentle breathing pulse, waits forever (no timer) --- */
      .tap-cue {
        position: fixed;
        width: 9vh;
        height: 9vh;
        margin-left: -4.5vh;
        margin-top: -4.5vh;
        border: none;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.92);
        box-shadow: 0 6px 20px rgba(90, 80, 60, 0.2);
        font-size: 4.4vh;
        cursor: pointer;
        display: none;
        z-index: 18;
        -webkit-tap-highlight-color: transparent;
      }
      .tap-cue--open {
        display: block;
        animation: cue-breathe 1.8s ease-in-out infinite;
      }
      @keyframes cue-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      /* --- Тёплое сияние награды: медленно, мягко, без вспышек --- */
      .reward-glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center,
          rgba(255, 216, 150, 0.55) 0%,
          rgba(255, 216, 150, 0.18) 45%,
          rgba(255, 216, 150, 0) 75%);
        opacity: 0;
        z-index: 12;
      }
      .reward-glow--on {
        animation: reward-shine 4.5s ease-in-out 1;
      }
      @keyframes reward-shine {
        0% { opacity: 0; }
        40% { opacity: 0.8; }
        100% { opacity: 0; }
      }

      /* --- Sophie's speech bubble (placeholder for voice-over) --- */
      .sophie-bubble {
        position: fixed;
        left: 50%;
        bottom: 30vh;
        transform: translateX(-50%) translateY(10px);
        max-width: 82vw;
        display: flex;
        align-items: center;
        gap: 1.6vh;
        padding: 1.8vh 2.6vh;
        border-radius: 24px;
        border: 3px solid #f2e3d1;
        background: rgba(255, 252, 246, 0.97);
        box-shadow: 0 8px 22px rgba(90, 80, 60, 0.18);
        font-size: 2.9vh;
        font-weight: 600;
        color: #6b5d4f;
        text-align: left;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease, transform 0.4s ease;
        z-index: 15;
      }
      .sophie-bubble::after {
        content: '';
        position: absolute;
        left: 4.2vh;
        bottom: -1.9vh;
        border-width: 2vh 1.4vh 0 1.4vh;
        border-style: solid;
        border-color: #f2e3d1 transparent transparent transparent;
      }
      .sophie-bubble--open {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* --- Pause: always available, calm, no confirm dialogs --- */
      .pause-button {
        position: fixed;
        top: 2.5vh;
        right: 2.5vh;
        width: 7vh;
        height: 7vh;
        border: 3px solid #f2e3d1;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.9);
        box-shadow: 0 4px 14px rgba(90, 80, 60, 0.16);
        font-size: 3.2vh;
        cursor: pointer;
        z-index: 20;
        -webkit-tap-highlight-color: transparent;
      }
      .sound-button {
        position: fixed;
        top: calc(2.5vh + 8.5vh);
        right: 2.5vh;
        width: 7vh;
        height: 7vh;
        border: 3px solid #f2e3d1;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.9);
        box-shadow: 0 4px 14px rgba(90, 80, 60, 0.16);
        font-size: 3.2vh;
        cursor: pointer;
        z-index: 20;
        -webkit-tap-highlight-color: transparent;
      }
      .pause-veil {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(210, 225, 235, 0.85);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        z-index: 30;
      }
      .pause-veil--open {
        opacity: 1;
        pointer-events: auto;
      }
      .pause-veil__message {
        font-size: 3.4vh;
        color: #5a6b74;
        text-align: center;
        padding: 0 6vw;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
