<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sophie &amp; Friends</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>" />
    <style>
      @font-face {
        font-family: 'Nunito';
        src: url('/fonts/nunito-600.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('/fonts/nunito-700.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('/fonts/nunito-800.woff2') format('woff2');
        font-weight: 800;
        font-display: swap;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #cfe8f5;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      }
      #app { width: 100%; height: 100%; }
      canvas { display: block; }

      /* --- Choice panel: max 3 large touch cards, no timer --- */
      .choice-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 1.5vh;
        padding: 3vw;
        align-items: center;
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 0.45s ease, transform 0.45s ease;
        pointer-events: none;
      }
      .choice-panel__prompt {
        padding: 1.4vh 2.6vh;
        border-radius: 18px;
        background: rgba(255, 250, 240, 0.92);
        box-shadow: 0 4px 16px rgba(90, 80, 60, 0.14);
        font-size: 2.6vh;
        font-weight: 600;
        color: #6b5d4f;
        text-align: center;
        max-width: 88vw;
      }
      .choice-panel__cards {
        display: flex;
        gap: 3vw;
        justify-content: center;
        align-items: stretch;
        width: 100%;
      }
      .choice-panel--open {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .choice-card {
        flex: 1;
        max-width: 32%;
        min-height: 25vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5vh;
        border: 3px solid #f2e3d1;
        border-radius: 28px;
        background: rgba(255, 252, 246, 0.97);
        box-shadow: 0 8px 24px rgba(90, 80, 60, 0.16);
        cursor: pointer;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .choice-card:hover {
        transform: scale(1.05);
        border-color: #eeceac;
        box-shadow: 0 10px 28px rgba(90, 80, 60, 0.22);
      }
      .choice-card:active {
        transform: scale(0.97);
      }
      .choice-card__icon {
        font-size: 9vh;
        line-height: 1;
        width: 11vh;
        height: 11vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .choice-card__label {
        font-size: 2.6vh;
        color: #6b5d4f;
        font-weight: 700;
      }

      /* --- Плавающие плашки: маркер над Бруно и имена (без миганий) --- */
      .float-chip {
        position: fixed;
        transform: translate(-50%, -100%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        z-index: 16;
      }
      .float-chip--on { opacity: 1; }
      .float-chip--marker {
        width: 7.5vh;
        height: 7.5vh;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.94);
        box-shadow: 0 5px 18px rgba(90, 80, 60, 0.2);
        font-size: 3.8vh;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: chip-bob 2.6s ease-in-out infinite;
      }
      .float-chip--name {
        padding: 0.8vh 2vh;
        border-radius: 14px;
        background: rgba(255, 250, 240, 0.92);
        box-shadow: 0 4px 12px rgba(90, 80, 60, 0.16);
        font-size: 2.2vh;
        font-weight: 700;
        color: #6b5d4f;
      }
      @keyframes chip-bob {
        0%, 100% { transform: translate(-50%, -100%) translateY(0) scale(1); }
        50% { transform: translate(-50%, -100%) translateY(-8px) scale(1.08); }
      }

      /* --- Аватар-кружок с портретом персонажа --- */
      .sophie-avatar {
        flex: none;
        width: 8.2vh;
        height: 8.2vh;
        border-radius: 50%;
        background: linear-gradient(180deg, #fdf6e9, #f3e6d0);
        border: 3px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 3px 10px rgba(70, 60, 45, 0.25);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sophie-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* --- Стартовая плашка-наведение --- */
      .intro-banner {
        position: fixed;
        left: 50%;
        bottom: 5vh;
        transform: translateX(-50%) translateY(16px);
        display: flex;
        align-items: center;
        gap: 1.6vh;
        padding: 1.8vh 2.6vh;
        border-radius: 22px;
        background: rgba(255, 250, 240, 0.96);
        box-shadow: 0 8px 26px rgba(90, 80, 60, 0.2);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease, transform 0.5s ease;
        z-index: 19;
        max-width: 86vw;
      }
      .intro-banner--on {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        pointer-events: auto;
      }
      .intro-banner__text {
        font-size: 2.6vh;
        font-weight: 600;
        color: #6b5d4f;
      }

      /* --- Tap cue: gentle breathing pulse, waits forever (no timer) --- */
      .tap-cue {
        position: fixed;
        width: 9vh;
        height: 9vh;
        margin-left: -4.5vh;
        margin-top: -4.5vh;
        border: none;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.92);
        box-shadow: 0 6px 20px rgba(90, 80, 60, 0.2);
        font-size: 4.4vh;
        cursor: pointer;
        display: none;
        z-index: 18;
        -webkit-tap-highlight-color: transparent;
      }
      .tap-cue--open {
        display: block;
        animation: cue-breathe 1.8s ease-in-out infinite;
      }
      @keyframes cue-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      /* --- Тёплое сияние награды: медленно, мягко, без вспышек --- */
      .reward-glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center,
          rgba(255, 216, 150, 0.55) 0%,
          rgba(255, 216, 150, 0.18) 45%,
          rgba(255, 216, 150, 0) 75%);
        opacity: 0;
        z-index: 12;
      }
      .reward-glow--on {
        animation: reward-shine 4.5s ease-in-out 1;
      }
      @keyframes reward-shine {
        0% { opacity: 0; }
        40% { opacity: 0.8; }
        100% { opacity: 0; }
      }

      /* --- Диалоговая плашка (Sims-стиль, адаптировано): низ экрана,
             портрет в кружке, текст по центру, без хвостика --- */
      .sophie-bubble {
        position: fixed;
        left: 50%;
        bottom: 4.5vh;
        transform: translateX(-50%) translateY(14px);
        min-width: 38vw;
        max-width: 74vw;
        display: flex;
        align-items: center;
        gap: 2.2vh;
        padding: 2vh 3.4vh 2vh 2vh;
        border-radius: 30px;
        border: 2px solid rgba(219, 197, 163, 0.65);
        background: linear-gradient(180deg,
          rgba(255, 252, 245, 0.97) 0%,
          rgba(249, 240, 224, 0.97) 100%);
        box-shadow:
          0 12px 34px rgba(70, 60, 45, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
        font-size: 2.8vh;
        font-weight: 700;
        color: #5d5143;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease, transform 0.45s ease;
        z-index: 15;
      }
      .sophie-bubble__text {
        flex: 1;
        text-align: center;
        line-height: 1.45;
      }
      .sophie-bubble--open {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* --- Pause: always available, calm, no confirm dialogs --- */
      .pause-button {
        position: fixed;
        top: 2.5vh;
        right: 2.5vh;
        width: 7vh;
        height: 7vh;
        border: 3px solid #f2e3d1;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.9);
        box-shadow: 0 4px 14px rgba(90, 80, 60, 0.16);
        font-size: 3.2vh;
        cursor: pointer;
        z-index: 20;
        -webkit-tap-highlight-color: transparent;
      }
      .sound-button {
        position: fixed;
        top: calc(2.5vh + 8.5vh);
        right: 2.5vh;
        width: 7vh;
        height: 7vh;
        border: 3px solid #f2e3d1;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.9);
        box-shadow: 0 4px 14px rgba(90, 80, 60, 0.16);
        font-size: 3.2vh;
        cursor: pointer;
        z-index: 20;
        -webkit-tap-highlight-color: transparent;
      }
      .exit-button {
        position: fixed;
        top: 2.5vh;
        left: 2.5vh;
        width: 7vh;
        height: 7vh;
        border: 3px solid #f2e3d1;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.9);
        box-shadow: 0 4px 14px rgba(90, 80, 60, 0.16);
        cursor: pointer;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
      }
      .exit-button--on { display: flex; }

      /* --- Кино-вставка: мягкий letterbox --- */
      .video-overlay {
        position: fixed;
        inset: 0;
        background: #100e0c;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease;
        z-index: 40;
      }
      .video-overlay--on {
        opacity: 1;
        pointer-events: auto;
      }
      .video-overlay video {
        max-width: 100%;
        max-height: 76vh;
      }
      .video-overlay__placeholder {
        width: 100%;
        height: 76vh;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 3.4vh;
        font-weight: 700;
        color: #f5ecdd;
        background: linear-gradient(160deg, #2b2620 0%, #4a3f31 55%, #6b5335 100%);
      }
      .video-overlay__caption {
        position: absolute;
        left: 50%;
        bottom: 9vh;
        transform: translate(-50%, 1.2vh);
        display: flex;
        align-items: center;
        gap: 1.4vh;
        max-width: 78vw;
        padding: 1.2vh 2.2vh 1.2vh 1.2vh;
        border-radius: 4vh;
        background: rgba(16, 14, 12, 0.55);
        color: #fff6e6;
        font-size: 2.6vh;
        font-weight: 700;
        line-height: 1.25;
        opacity: 0;
        transition: opacity 0.35s ease, transform 0.35s ease;
        pointer-events: none;
      }
      .video-overlay__caption--on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .video-overlay__caption img {
        width: 5.6vh;
        height: 5.6vh;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
      }
      .video-overlay__hint {
        position: absolute;
        bottom: 3vh;
        width: 100%;
        text-align: center;
        font-size: 2vh;
        color: rgba(245, 236, 221, 0.65);
      }

      .choice-card__icon img,
      .choice-panel__prompt-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .choice-panel__prompt {
        display: flex;
        align-items: center;
        gap: 1.2vh;
        justify-content: center;
      }
      .choice-panel__prompt-icon {
        flex: none;
        width: 4.4vh;
        height: 4.4vh;
      }
      .float-chip--marker img {
        width: 66%;
        height: 66%;
        display: block;
      }
      .float-chip--marker {
        overflow: hidden;
      }

      .pause-veil {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(210, 225, 235, 0.85);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        z-index: 30;
      }
      .pause-veil--open {
        opacity: 1;
        pointer-events: auto;
      }
      .pause-veil__message {
        font-size: 3.4vh;
        color: #5a6b74;
        text-align: center;
        padding: 0 6vw;
      }
    
      /* Клавиша H — спрятать интерфейс для чистых скриншотов (референсы для видео, питч) */
      body.hud-hidden .pause-button, body.hud-hidden .sound-button,
      body.hud-hidden .exit-button, body.hud-hidden .intro-banner,
      body.hud-hidden .tap-cue, body.hud-hidden .float-chip,
      body.hud-hidden .sophie-bubble, body.hud-hidden .choice-panel {
        visibility: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
